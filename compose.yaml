services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tidehouse
      POSTGRES_USER: tidehouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tidehouse-local-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tidehouse"]
      interval: 5s
      timeout: 5s
      retries: 10
  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  migrate:
    build: .
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://tidehouse:${POSTGRES_PASSWORD:-tidehouse-local-only}@db:5432/tidehouse
      PAYMENT_PROVIDER: simulated
    depends_on:
      db: { condition: service_healthy }
  app:
    build: .
    ports: ["127.0.0.1:3000:3000"]
    environment:
      DATABASE_URL: postgresql://tidehouse:${POSTGRES_PASSWORD:-tidehouse-local-only}@db:5432/tidehouse
      APP_ORIGIN: http://localhost:3000
      APP_ENV: development
      PAYMENT_PROVIDER: simulated
      SMTP_URL: smtp://mail:1025
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  postgres_data:
