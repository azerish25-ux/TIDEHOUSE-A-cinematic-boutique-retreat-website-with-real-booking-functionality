name: Import generated TIDEHOUSE artwork
on:
  push:
    branches: [main]
    paths: ['.artwork-source.json']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate artwork and prepare an unpublished asset commit
        run: node scripts/import-artwork.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: tidehouse-artwork-import
          path: evidence/artwork-import.json
          retention-days: 3
