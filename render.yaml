# Deployment blueprint. Provisioning may incur hosting charges; review the provider plan first.
services:
  - type: web
    name: tidehouse
    runtime: docker
    healthCheckPath: /api/health
    preDeployCommand: npm run db:migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: tidehouse-db, property: connectionString }
      - key: APP_ENV
        value: production
      - key: PAYMENT_PROVIDER
        value: stripe
      - key: APP_ORIGIN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TRUST_PROXY
        value: 'true'
databases:
  - name: tidehouse-db
    databaseName: tidehouse
    user: tidehouse
